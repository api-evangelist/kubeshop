            '
        flipRate:
          type: number
          format: float64
          description: "Fraction of status changes among consecutive executions without recency weighting \n(value between 0.0 and 1.0).\n"
        overallHealth:
          type: number
          format: float64
          description: 'Combined health score, computed as passRate * (1 - flipRate)

