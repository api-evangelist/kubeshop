generated: '2026-07-19'
method: searched
status: published
source: https://docs.testkube.io/articles/mcp-overview
docs: https://docs.testkube.io/articles/mcp-overview
server:
  name: testkube
  transport: http
  url: https://api.testkube.io/organizations/{organization_id}/environments/{environment_id}/mcp
  discovery_base: https://api.testkube.io/mcp
  protocol: Model Context Protocol
  description: >-
    Testkube's hosted MCP server lets AI assistants list and run test workflows,
    inspect executions, fetch logs and artifacts, and query results. The endpoint is
    scoped per organization and environment; organization and environment IDs come
    from the Testkube dashboard.
deployments:
- kind: hosted
  recommended: true
  url: https://api.testkube.io/organizations/{organization_id}/environments/{environment_id}/mcp
  auth: oauth
  docs: https://docs.testkube.io/articles/mcp-hosted
- kind: cli
  command: testkube mcp serve
  transports: [stdio, shttp]
  docs: https://docs.testkube.io/articles/mcp-cli
- kind: docker
  transports: [stdio, shttp]
  docs: https://docs.testkube.io/articles/mcp-docker
authorization:
  standard: OAuth 2.1 with RFC 8414 + RFC 9728 discovery metadata
  methods:
  - kind: oauth
    recommended: true
    note: browser login; no API keys to create, copy, or rotate
  - kind: api_token
    header: 'Authorization: Bearer <API_TOKEN>'
    note: for automation where browser auth is impractical; tokens issued from Organization Settings → API Tokens
  authorization_servers:
  - https://api.testkube.io
  authorization_endpoint: https://api.testkube.io/mcp/auth/authorize
  token_endpoint: https://api.testkube.io/mcp/auth/token
  registration_endpoint: https://api.testkube.io/mcp/auth/register
  revocation_endpoint: https://api.testkube.io/mcp/auth/revoke
  dynamic_client_registration: true
  client_id_metadata_document_supported: true
  grant_types_supported: [authorization_code, refresh_token]
  code_challenge_methods_supported: [S256]
  token_endpoint_auth_methods_supported: [none]
  scopes_supported: [mcp:full]
  bearer_methods_supported: [header]
  docs: https://docs.testkube.io/articles/mcp-security
tool_count: 30
